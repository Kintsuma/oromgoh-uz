<title>Oromgoh.uz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Noto+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>

/* Layout: oromgoh paneli — qit'a bo'limlari va qidiruv tanlovni belgilaydi, pastdagi barcha bloklar shu tanlovga moslashadi */
:root{
  --bg:#f5f7fb; --panel:#ffffff; --ink:#14213a; --muted:#5b6782; --line:#dfe4ef;
  --lapis:#1f4e9c; --lapis-soft:#e3ebf8; --firuza:#138a8a; --firuza-soft:#dff2f1;
  --zar:#b9761c; --zar-soft:#f8ecd9; --on-accent:#ffffff; --qizil:#c0392b; --r-toza:#1f7f43; --r-iflos:#f2c230; --r-band:#c0392b; --r-ink:#ffffff; --r-ink-y:#2a2300; --r-toza-t:#1f7f43; --r-iflos-t:#9a7400; --side-bg:#0f1e3a; --side-ink:#c9d4ea; --side-mute:#7f8db0; --side-act:#2556a8; --side-hov:#18294a;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Noto Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1424; --panel:#161e33; --ink:#e7ecf7; --muted:#9aa6c2; --line:#273252;
  --lapis:#7ea6ec; --lapis-soft:#1e2c4f; --firuza:#4cc3bd; --firuza-soft:#143535;
  --zar:#e3a64f; --zar-soft:#3a2c17; --on-accent:#0e1424; --qizil:#ef7b6c; --r-toza:#3fb56c; --r-iflos:#e9c23a; --r-band:#e2604f; --r-ink:#0e1424; --r-ink-y:#1f1a00; --r-toza-t:#4cc87c; --r-iflos-t:#e9c23a; --side-bg:#080e1b; --side-ink:#c9d4ea; --side-mute:#6f7da0; --side-act:#2a4f8f; --side-hov:#121c33; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1424; --panel:#161e33; --ink:#e7ecf7; --muted:#9aa6c2; --line:#273252;
  --lapis:#7ea6ec; --lapis-soft:#1e2c4f; --firuza:#4cc3bd; --firuza-soft:#143535;
  --zar:#e3a64f; --zar-soft:#3a2c17; --on-accent:#0e1424; --qizil:#ef7b6c; --r-toza:#3fb56c; --r-iflos:#e9c23a; --r-band:#e2604f; --r-ink:#0e1424; --r-ink-y:#1f1a00; --r-toza-t:#4cc87c; --r-iflos-t:#e9c23a; --side-bg:#080e1b; --side-ink:#c9d4ea; --side-mute:#6f7da0; --side-act:#2a4f8f; --side-hov:#121c33; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lapis);outline-offset:2px}

header.hero{padding-block:36px 24px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(34px,6vw,60px);font-weight:800;line-height:1}
.hero h1 span{color:var(--lapis)}
.hero p{margin:10px 0 0;color:var(--muted);max-width:62ch}
.pattern{width:130px;height:130px}
@media (max-width:640px){header.hero{grid-template-columns:1fr}.pattern{display:none}}

/* control bar */
.controls{position:relative;background:var(--bg);padding-block:14px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tab{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 14px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.tab small{font-family:var(--mono);color:var(--muted);font-size:12px}
.tab[aria-selected="true"]{background:var(--lapis);border-color:var(--lapis);color:var(--on-accent)}
.tab[aria-selected="true"] small{color:var(--on-accent);opacity:.8}
.searchrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1 1 320px;min-width:0}
.search input{width:100%;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px 9px 36px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;cursor:pointer}
.btn.primary{background:var(--lapis);border-color:var(--lapis);color:var(--on-accent)}
.msg{font-size:13px;color:var(--zar);min-height:0}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:14px}
.crumbs button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 12px;cursor:pointer}
.crumbs button[aria-current="true"]{border-color:var(--lapis);color:var(--lapis);font-weight:600}
.crumbs .sep{color:var(--muted)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.kpi{background:var(--panel);padding:16px 18px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kpi b{font-family:var(--display);font-size:clamp(22px,3vw,32px);font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted)}
.kpi.lead b{color:var(--lapis)}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi.lead{grid-column:1/-1}}

section.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-head h2{font-size:21px;font-weight:700}
.sec-head p{margin:0;color:var(--muted);font-size:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
[hidden]{display:none!important}
.list,.part,.view>*{min-width:0}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px}
@media (max-width:620px){.cols2{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:4px}

.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;align-items:center;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:7px 10px}
button.bar{cursor:pointer}
button.bar:hover{background:var(--bg)}
.bar[aria-pressed="true"]{border-color:var(--lapis);background:var(--lapis-soft)}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .nm em{font-style:normal;color:var(--muted);font-size:13px}
.bar .ct{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap}
.track{grid-column:1/-1;height:7px;border-radius:4px;background:var(--line);overflow:hidden;display:flex}
.track i{display:block;height:100%}
.f-main{background:var(--lapis)} .f-uz{background:var(--zar)} .f-alt{background:var(--firuza)}
.gender{grid-column:1/-1;height:8px;border-radius:4px;overflow:hidden;display:flex}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.empty{color:var(--muted);margin:0;font-size:14px}
.more{align-self:flex-start}

svg text{fill:var(--muted);font-family:var(--mono);font-size:11px}
svg .grid{stroke:var(--line)}
.chartbox{overflow-x:auto}

.filters{display:flex;gap:10px;flex-wrap:wrap}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;flex:1 1 200px;min-width:0}
select,.filters input{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;text-transform:none;letter-spacing:0;font-weight:400}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:900px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--bg)}
td.r,th.r{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px}
.pill.asl{background:var(--firuza-soft);color:var(--firuza)}
.pill.qo{background:var(--line);color:var(--muted)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.pager button:disabled{opacity:.4;cursor:default}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--zar);padding:4px 0 4px 12px;margin:0;max-width:95ch}
footer{color:var(--muted);font-size:13px}
.lead-p{margin:0;color:var(--muted);max-width:70ch}
.pred{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:start}
@media (max-width:900px){.pred{grid-template-columns:1fr}}
.pred-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.pred-form{grid-template-columns:1fr}}
.pred-form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;min-width:0}
.pred-out{background:var(--bg);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.big{font-family:var(--display);font-size:clamp(44px,7vw,68px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--lapis)}
.gauge{position:relative;height:12px;border-radius:6px;background:var(--line);overflow:visible}
.gauge i{display:block;height:100%;border-radius:6px;background:var(--lapis)}
.gauge span{position:absolute;top:-4px;width:2px;height:20px;background:var(--ink)}
.verdict{font-size:14px;color:var(--muted)}
.verdict b{color:var(--ink)}
.why{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.eff{display:grid;grid-template-columns:minmax(0,1fr) 120px auto;gap:10px;align-items:center;font-size:14px}
.eff .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eff .nm em{font-style:normal;color:var(--muted)}
.eff .ax{position:relative;height:8px;background:var(--line);border-radius:4px}
.eff .ax::after{content:"";position:absolute;left:50%;top:-3px;width:1px;height:14px;background:var(--muted)}
.eff .ax i{position:absolute;top:0;height:100%;border-radius:4px}
.eff .ax i.up{left:50%;background:var(--firuza)} .eff .ax i.dn{right:50%;background:var(--zar)}
.eff .val{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:64px;text-align:right}
.inner{margin-top:4px}
.h3{font-size:16px;font-weight:700}
.sections{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media (max-width:900px){.sections{display:flex;overflow-x:auto;padding-bottom:2px}}
.sections button{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px;border:1px solid var(--line);background:var(--panel);border-radius:12px;cursor:pointer;font-size:14px;font-weight:600;min-width:96px}
.sections button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sections button:hover{border-color:var(--lapis)}
.sections button[aria-current="page"]{background:var(--lapis);border-color:var(--lapis);color:var(--on-accent)}
.filterbox{display:flex;flex-direction:column;gap:8px}
.filter-label{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted);margin:0}
.view{display:flex;flex-direction:column;gap:24px}
.view-intro{margin:0;font-size:16px;max-width:75ch}
.about{color:var(--muted);font-size:13px}
.about summary{cursor:pointer;font-weight:600}
.about .note{margin-top:8px}
.pred-form.wide{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:820px){.pred-form.wide{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.pred-form.wide{grid-template-columns:1fr}}
.agree{border-radius:10px;padding:10px 14px;font-size:14px;background:var(--bg)}
.agree.ok{background:var(--firuza-soft)} .agree.ok b{color:var(--firuza)}
.agree.diff{background:var(--zar-soft)} .agree.diff b{color:var(--zar)}
.parts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:900px){.parts{grid-template-columns:minmax(0,1fr)}}
.part{border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.part-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.part-head h3{font-size:18px;font-weight:700}
.tag{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 10px;border-radius:999px;background:var(--lapis-soft);color:var(--lapis)}
.tag.svm{background:var(--firuza-soft);color:var(--firuza)}
.big.svm{color:var(--firuza)}
.dgauge{position:relative;height:12px;border-radius:6px;background:var(--line)}
.dgauge .zero{position:absolute;left:50%;top:-4px;width:2px;height:20px;background:var(--ink);transform:translateX(-1px)}
.dgauge i{position:absolute;top:0;height:100%;border-radius:6px}
.dgauge i.up{background:var(--firuza)} .dgauge i.dn{background:var(--zar)}
.dscale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.how summary{cursor:pointer;font-weight:600;font-size:14px}
.how .steps{margin-top:8px}
table.cmp{min-width:680px}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.metrics div{background:var(--bg);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column}
.metrics b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.metrics span{font-size:12px;color:var(--muted)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--ink);max-width:65ch}
.tf-groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.tf-groups{grid-template-columns:minmax(0,1fr)}}
.tf-group{background:var(--bg);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tf-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.tf-head b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px}
.tf-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tf{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tf .nm{font-size:13px;color:var(--muted);font-weight:600}
.tf b{font-family:var(--display);font-size:clamp(22px,2.6vw,30px);font-variant-numeric:tabular-nums;line-height:1.1}
.tf small{color:var(--muted);font-family:var(--mono);font-size:12px}
.tf.m b{color:var(--lapis)} .tf.f b{color:var(--zar)}
.tf-split{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line)}
.tf-split i{display:block;height:100%}
table.yt{min-width:760px}
.timeline{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:900px){.timeline{grid-template-columns:minmax(0,1fr)}}
.timeline li{border-top:3px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.timeline li.hot{border-top-color:var(--qizil)}
.timeline time{font-family:var(--mono);font-size:13px;font-weight:500}
.timeline span{font-size:14px;color:var(--muted)}
.pan-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.pan-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pk{background:var(--bg);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:2px;border-left:4px solid var(--c)}
.pk .nm{font-size:13px;color:var(--muted);font-weight:600}
.pk b{font-family:var(--display);font-size:clamp(22px,2.8vw,30px);font-variant-numeric:tabular-nums}
.pk small{color:var(--muted);font-size:12px}
.tf-row.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:520px){.tf-row.three{grid-template-columns:repeat(2,minmax(0,1fr))}}
.callout{background:var(--zar-soft);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.5}
.callout b{color:var(--zar)}
table.yt tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
table.yt td:first-child{font-family:var(--mono)}
code{font-family:var(--mono);font-size:13px;background:var(--bg);padding:1px 5px;border-radius:4px}
@media (prefers-reduced-motion:no-preference){.track i,.gender i{transition:width .35s ease}}

/* ---- 3-versiya qo'shimchalari ---- */
.sections{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
@media (max-width:640px){.sections{display:flex;overflow-x:auto;padding-bottom:4px}}
.sections button{min-width:96px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.langs{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.langs button{border:0;background:none;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--lapis);color:var(--on-accent)}
.map{width:100%;height:auto;display:block}
.map path.c{stroke:var(--panel);stroke-width:.6;cursor:pointer;transition:opacity .15s}
.map path.c.none{fill:var(--line);cursor:default}
.map path.c:hover{opacity:.8}
.map path.c[data-sel="1"]{stroke:var(--ink);stroke-width:1.6}
.map path.nb{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:3 3}
.map circle.dot{stroke:var(--panel);stroke-width:1;cursor:pointer}
.map text.lb{font-family:var(--mono);font-size:11px;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:3px;pointer-events:none;text-anchor:middle}
.maplegend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.maplegend .ramp{display:flex;height:10px;width:200px;border-radius:5px;overflow:hidden}
.maplegend .ramp i{flex:1}
.mapinfo{font-size:14px;min-height:22px}
.mapinfo b{font-family:var(--mono)}
.cmp-pick{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:end}
@media (max-width:620px){.cmp-pick{grid-template-columns:minmax(0,1fr)}}
.cmp-pick label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;min-width:0}
table.vs{min-width:560px}
table.vs td.metric{color:var(--muted)}
table.vs td.va,table.vs td.vb{font-family:var(--mono);font-variant-numeric:tabular-nums}
table.vs .mini{display:block;height:5px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden}
table.vs .mini i{display:block;height:100%}
table.vs th.ha{color:var(--lapis)} table.vs th.hb{color:var(--zar)}
.win{font-weight:700}
.seasons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}

function forecast(A) {
  const pts = Y.map((y, i) => [+y, A.y[i]]).filter(([y]) => y >= 2015 && y <= 2025 && y !== 2020 && y !== 2021);
  const tot = pts.reduce((a, p) => a + p[1], 0); if (tot < 60) return null;
  const n = pts.length, mx = pts.reduce((a, p) => a + p[0], 0) / n, my = tot / n;
  const b = pts.reduce((a, p) => a + (p[0] - mx) * (p[1] - my), 0) / pts.reduce((a, p) => a + (p[0] - mx) ** 2, 0), a = my - b * mx;
  const sd = Math.sqrt(pts.reduce((s, p) => s + (p[1] - (a + b * p[0])) ** 2, 0) / Math.max(1, n - 2));
  const f = y => Math.max(0, a + b * y);
  return { a, b, sd, f, y26: f(2026), y27: f(2027), so26: A.y[Y.indexOf('2026')] };
}

  const rng = v => t('fc_range', { a: fmt(Math.max(0, v - 1.96 * F.sd)), b: fmt(v + 1.96 * F.sd) });
  $('fc-nums').innerHTML = `
    <div class="pk" style="--c:var(--firuza)"><span class="nm">${t('fc_2026')}</span><b>${fmt(Math.max(F.y26, F.so26))}</b><small>${t('fc_2026s', { n: fmt(F.so26) })}</small></div>

  const yrs = [...Y.map(Number), 2027], W = 900, H = 260, L0 = 60, Rr = 12, T0 = 16, B = 28, cw = W - L0 - Rr, ch = H - T0 - B;

const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const REC = "Do'st yoki tanish tavsiyasi";

/* ---- 1000 ta xona: 10 korpus × 4 qavat × 25 xona ---- */
const KORPUS = 'ABCDEFGHIJ'.split('');
const ROOMS = []; KORPUS.forEach(k => { for (let f = 1; f <= 4; f++) for (let n = 1; n <= 25; n++) ROOMS.push(`${k}${f}${String(n).padStart(2, '0')}`); });
let KSEL = 'A', ROOMSEL = null, ROOMCONFIRM = false, HKASK = null;
const occupant = id => GUESTS.find(g => g.holat === 'oromgohda' && g.xona === id);
const roomState = id => occupant(id) ? 'band' : (ROOMS_DB[id] && ROOMS_DB[id].toza === false ? 'iflos' : 'toza');
const freeRooms = () => ROOMS.filter(r => roomState(r) === 'toza');

/* ---- Mehmon -> statistika kubiga qator ---- */
const toifaOf = (yosh, jinsi, oila) => yosh < 16 ? (jinsi === 'erkak' ? "o'g'il bola" : 'qiz bola') : oila === 'turmush qurgan' ? (jinsi === 'erkak' ? 'erkak' : 'ayol') : (jinsi === 'erkak' ? 'yigit' : 'qiz');
const ageGroup = a => a < 16 ? 0 : a < 25 ? 1 : a < 35 ? 2 : a < 45 ? 3 : a < 55 ? 4 : a < 65 ? 5 : 6;
function guestRow(g) {
  const base = BASE.find(r => r.d === g.davlat) || BASE[0], o = zero();
  o.q = base.q; o.m = base.m; o.d = g.davlat; o.v = g.hudud; o.n = 1;
  if (g.jinsi === 'erkak') o.e = 1; else o.a = 1;
  const yosh = +g.yosh; o.s = yosh; o.c = 1;
  const ki = K.indexOf(g.kanal); if (ki >= 0) o.k[ki] = 1;
  const ti = T.indexOf(g.tavsiya); if (g.kanal === REC && ti >= 0) o.t[ti] = 1;
  const yi = Y.indexOf(g.sana.slice(0, 4)), tfk = toifaOf(yosh, g.jinsi, g.oila), tfi = TFI[tfk];
  if (yi >= 0) { o.y[yi] = 1; o.yt[yi * TF.length + tfi] = 1; }
  o.g[ageGroup(yosh)] = 1; o.tf[tfi] = 1; o.ps[PSI['kelgan']] = 1;
  const mi = PMON.indexOf(g.sana.slice(0, 7)); if (mi >= 0) o.pm[mi * PS.length + PSI['kelgan']] = 1;
  o.mo[+g.sana.slice(5, 7) - 1] = 1; o.dev[DEV.indexOf('Other/Unknown')] = 1; o.brw[BRW.indexOf('-unknown-')] = 1;
  const cl = nearestCluster(yosh, g.jinsi === 'ayol' ? 1 : 0, yosh < 16 ? 1 : 0, yosh >= 16 && g.oila === 'turmush qurgan' ? 1 : 0, g.davlat === UZ ? 1 : 0);
  o.kl[KL.indexOf(cl)] = 1;
  return o;
}
const validGuest = g => g && typeof g.ism === 'string' && g.ism.trim() && BASE.some(r => r.d === g.davlat && r.v === g.hudud) && /^\d{4}-\d{2}-\d{2}$/.test(g.sana || '')
  && Y.includes(String(g.sana).slice(0, 4)) && Number.isInteger(+g.yosh) && +g.yosh >= 0 && +g.yosh <= 100 && (g.jinsi === 'erkak' || g.jinsi === 'ayol') && K.includes(g.kanal);
function decorate(g) { g._q = (BASE.find(r => r.d === g.davlat) || {}).q; g._m = (BASE.find(r => r.d === g.davlat) || {}).m; g._toifa = toifaOf(+g.yosh, g.jinsi, g.oila); if (!g.holat) g.holat = 'ketgan'; return g; }
function rebuildExtra() {
  GUESTS = GUESTS.filter(validGuest).map(decorate);
  EXTRA = GUESTS.filter(g => g.holat === 'oromgohda' || g.holat === 'ketgan');   // bron qilinganlar hali kelmagan
  EXTRA_ROWS = EXTRA.map(guestRow); R = BASE.concat(EXTRA_ROWS); TOTAL = D.jami + EXTRA.length;
  if (ROLE === 'menejer') { buildSearch(); buildCmpOptions(); render(); }
  renderOps();
}

/* ---- Forma ---- */
function buildAddForm(keepVals) {
  const dv = $('a-davlat').value, hv = $('a-hudud').value, kv = $('a-kanal').value, tv = $('a-tavsiya').value, xv = $('a-xona').value;
  const davs = groupBy(BASE, 'd').map(x => x.k).sort((a, b) => nm(a).localeCompare(nm(b)));
  $('a-davlat').innerHTML = davs.map(d => `<option value="${esc(d)}">${esc(nm(d))}</option>`).join('');
  $('a-davlat').value = keepVals && dv ? dv : UZ;
  fillHudud(keepVals ? hv : null);
  $('a-kanal').innerHTML = K.map(k => `<option value="${esc(k)}">${esc(nm(k))}</option>`).join('');
  $('a-kanal').value = keepVals && kv ? kv : REC;
  $('a-tavsiya').innerHTML = T.map(k => `<option value="${esc(k)}">${esc(nm(k))}</option>`).join('');
  if (keepVals && tv) $('a-tavsiya').value = tv;
  $('a-tavsiya-l').hidden = $('a-kanal').value !== REC;
  document.querySelectorAll('#a-holat option').forEach(o => o.textContent = t('h_' + o.value));
  document.querySelectorAll('#g-st option').forEach(o => o.textContent = o.value === '' ? t('all') : o.value === 'faol' ? t('gs_faol') : t('h_' + o.value));
  $('g-q').placeholder = t('g_ph');
  if (!$('a-sana').value) $('a-sana').value = today();
  if (!$('a-ketish').value) $('a-ketish').value = addDays(today(), 3);
  fillRooms(keepVals ? xv : null);
}
function fillRooms(keep) {
  const fr = freeRooms(), bron = $('a-holat').value === 'bron';
  $('a-xona').innerHTML = (bron ? `<option value="">${esc(t('a_xona_later'))}</option>` : '') + fr.map(r => `<option value="${r}">${r}</option>`).join('');
  if (keep && (fr.includes(keep) || (bron && keep === ''))) $('a-xona').value = keep;
}
function fillHudud(keep) {
  const d = $('a-davlat').value, hs = BASE.filter(r => r.d === d).map(r => r.v).sort((a, b) => nm(a).localeCompare(nm(b)));
  $('a-hudud').innerHTML = hs.map(h => `<option value="${esc(h)}">${esc(nm(h))}</option>`).join('');
  if (keep && hs.includes(keep)) $('a-hudud').value = keep;
}
$('a-davlat').onchange = () => fillHudud(null);
$('a-holat').onchange = () => { $('a-sana').value = $('a-holat').value === 'bron' ? addDays(today(), 1) : today(); $('a-ketish').value = addDays($('a-sana').value, 3); fillRooms($('a-holat').value === 'bron' ? '' : null); };
$('a-kanal').onchange = () => { $('a-tavsiya-l').hidden = $('a-kanal').value !== REC; };
$('a-yosh').oninput = () => { $('a-oila').disabled = (+$('a-yosh').value < 16); };
const opmsg = (cls, key, v) => { const el = $('op-msg'); el.className = 'formmsg ' + cls; el.textContent = key ? t(key, v) : ''; clearTimeout(opmsg._t); if (cls === 'ok') opmsg._t = setTimeout(() => { el.textContent = ''; }, 6000); };
const fmsg = (cls, key, v) => { $('a-msg').className = 'formmsg ' + cls; $('a-msg').textContent = key ? t(key, v) : ''; };
$('addform').addEventListener('submit', async e => {
  e.preventDefault(); fmsg('', '');
  const y = +$('a-yosh').value, holat = $('a-holat').value;
  const g = { ism: $('a-ism').value.trim().slice(0, 60), davlat: $('a-davlat').value, hudud: $('a-hudud').value, sana: $('a-sana').value, ketish: $('a-ketish').value,
    jinsi: $('a-jinsi').value, yosh: y, oila: y < 16 ? 'voyaga yetmagan' : $('a-oila').value, kanal: $('a-kanal').value, holat, xona: $('a-xona').value || '' };
  if (g.kanal === REC) g.tavsiya = $('a-tavsiya').value;
  if (!g.ism) { fmsg('err', 'a_err_name'); $('a-ism').focus(); return; }
  if (!Number.isInteger(y) || y < 0 || y > 100 || $('a-yosh').value === '') { fmsg('err', 'a_err_age'); $('a-yosh').focus(); return; }
  if (!g.sana || g.sana < '2010-01-01' || (holat === 'oromgohda' && g.sana > today()) || (holat === 'bron' && g.sana < today())) { fmsg('err', holat === 'bron' ? 'a_err_bron' : 'a_err_date'); $('a-sana').focus(); return; }
  if (!g.ketish || g.ketish < g.sana) { fmsg('err', 'a_err_out'); $('a-ketish').focus(); return; }
  if (holat === 'oromgohda' && !g.xona) { fmsg('err', 'a_err_room'); return; }
  if (g.xona && roomState(g.xona) !== 'toza') { fmsg('err', 'a_err_roomtaken', { x: g.xona }); fillRooms(null); return; }
  $('a-save').disabled = true;
  try {
    g.createdAt = new Date().toISOString(); g.createdBy = UID; if (holat === 'oromgohda') g.keldiAt = g.createdAt;
    await DB.collection('mehmonlar').add(g); afterGuestAdded(g);
    opmsg('ok', holat === 'bron' ? 'a_saved_bron' : 'a_saved', { x: g.ism, r: g.xona }); $('a-ism').value = ''; closeDrawer();
  } catch (err) { fmsg('err', err && err.code === 'invalid_argument' ? 'a_ro' : err && err.code === 'quota_exceeded' ? 'a_quota' : 'a_fail'); }
  finally { $('a-save').disabled = false; }
});

/* ---- Yon panel (yangi mehmon) ---- */
function openDrawer() { buildAddForm(true); fmsg('', ''); $('drawer').hidden = false; $('drawer-bg').hidden = false; setTimeout(() => $('a-ism').focus(), 30); }
function closeDrawer() { if (!$('drawer')) return; $('drawer').hidden = true; $('drawer-bg').hidden = true; }
$('open-add').onclick = () => { PENDING_BRON = null; openDrawer(); }; $('close-add').onclick = closeDrawer; $('drawer-bg').onclick = closeDrawer;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('drawer').hidden) closeDrawer(); });

/* ---- Qabulxona amallari ---- */
const nowIso = () => new Date().toISOString();
let OPBUSY = false, PICK = null, DELASK = null;
let ACTERR = '';
async function act(fn) { if (OPBUSY) return; OPBUSY = true; ACTERR = ''; try { await fn(); } catch (e) { ACTERR = e && e.code === 'invalid_argument' ? 'a_ro' : 'a_fail'; if (VIEW !== 'xonalar') opmsg('err', ACTERR); } finally { OPBUSY = false; renderOps(); } }
const checkIn = (id, room) => act(async () => {
  if (roomState(room) !== 'toza') { fmsg('err', 'a_err_roomtaken', { x: room }); return; }
  await DB.doc('mehmonlar/' + id).update({ holat: 'oromgohda', xona: room, keldiAt: nowIso(), sana: today() }); PICK = null;
});
const checkOut = (id) => act(async () => {
  const g = GUESTS.find(x => x.id === id); if (!g) return;
  await DB.doc('mehmonlar/' + id).update({ holat: 'ketgan', ketdiAt: nowIso(), ketish: today() });
  if (g.xona) await DB.doc('xonalar/' + g.xona).set({ toza: false, at: nowIso(), by: UID });
});
const delGuest = (id) => act(async () => { await DB.doc('mehmonlar/' + id).delete(); DELASK = null; });
const setRoom = (room, toza) => act(async () => { await DB.doc('xonalar/' + room).set({ toza, at: nowIso(), by: UID }); ROOMCONFIRM = false; });

function guestItem(g, ctx) {
  const can = ROLE === 'menejer' || ROLE === 'qabulxona';
  const st = `<span class="pill st-${g.holat}">${esc(t('h_' + g.holat))}</span>`;
  const meta = [nm(g.davlat), g.xona ? t('g_room', { x: g.xona }) : t('g_noroom'), `${g.sana} → ${g.ketish || '—'}`].filter(Boolean).join(' · ');
  let actn = '';
  if (can && g.holat === 'bron') {
    if (PICK === g.id) { const fr = freeRooms(); const def = g.xona && fr.includes(g.xona) ? g.xona : fr[0];
      actn = `<select class="sm" data-pick-sel="${g.id}">${fr.map(r => `<option ${r === def ? 'selected' : ''}>${r}</option>`).join('')}</select><button type="button" class="btn sm primary" data-in="${g.id}">${t('g_confirm_in')}</button><button type="button" class="btn sm" data-pick-cancel="1">${t('del_no')}</button>`;
    } else actn = `<button type="button" class="btn sm primary" data-pick="${g.id}">${t('g_in')}</button>`;
  }
  if (can && g.holat === 'oromgohda') actn = `<button type="button" class="btn sm warn" data-out="${g.id}">${t('g_out')}</button>`;
  if (ROLE === 'menejer') actn += DELASK === g.id ? ` <button type="button" class="rowdel danger" data-del="${g.id}">${t('del_yes')}</button><button type="button" class="rowdel" data-del-cancel="1">${t('del_no')}</button>` : ` <button type="button" class="rowdel" data-delask="${g.id}">${t('del')}</button>`;
  return `<div class="op"><div class="op-main"><b>${esc(g.ism)}</b> ${st}<span>${esc(meta)}</span></div><div class="op-act">${actn}</div></div>`;
}
function wireOps(el) {
  el.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { PICK = b.dataset.pick; renderOps(); });
  el.querySelectorAll('[data-pick-cancel]').forEach(b => b.onclick = () => { PICK = null; renderOps(); });
  el.querySelectorAll('[data-in]').forEach(b => b.onclick = () => checkIn(b.dataset.in, el.querySelector(`[data-pick-sel="${b.dataset.in}"]`).value));
  el.querySelectorAll('[data-out]').forEach(b => b.onclick = () => checkOut(b.dataset.out));
  el.querySelectorAll('[data-delask]').forEach(b => b.onclick = () => { DELASK = b.dataset.delask; renderOps(); });
  el.querySelectorAll('[data-del-cancel]').forEach(b => b.onclick = () => { DELASK = null; renderOps(); });
  el.querySelectorAll('[data-del]').forEach(b => b.onclick = () => delGuest(b.dataset.del));
}
const emptyBox = key => `<p class="empty">${t(key)}</p>`;
function renderOps() {
  if (!UNLOCKED) return;
  const td = today();
  const comingToday = GUESTS.filter(g => g.holat === 'bron' && g.sana <= td).sort((a, b) => a.sana.localeCompare(b.sana));
  const leavingToday = GUESTS.filter(g => g.holat === 'oromgohda' && g.ketish && g.ketish <= td);
  const inside = GUESTS.filter(g => g.holat === 'oromgohda');
  const cnt = { toza: 0, iflos: 0, band: 0 }; ROOMS.forEach(r => cnt[roomState(r)]++);
  $('op-kpis').innerHTML = `
    <div class="kpi lead"><span class="lbl">${t('k_inside')}</span><b>${fmt(inside.length)}</b><small>${t('k_inside_s', { n: fmt(cnt.band) })}</small></div>
    <div class="kpi"><span class="lbl">${t('k_in_today')}</span><b>${fmt(comingToday.length)}</b><small>${td}</small></div>
    <div class="kpi"><span class="lbl">${t('k_out_today')}</span><b>${fmt(leavingToday.length)}</b><small>${td}</small></div>
    <div class="kpi"><span class="lbl">${t('k_free')}</span><b style="color:var(--r-toza-t)">${fmt(cnt.toza)}</b><small>${t('k_of', { n: fmt(ROOMS.length) })}</small></div>
    <div class="kpi"><span class="lbl">${t('k_dirty')}</span><b style="color:var(--r-iflos-t)">${fmt(cnt.iflos)}</b><small>${t('k_dirty_s')}</small></div>`;
  $('sub-today-in').textContent = t('n_guests', { n: fmt(comingToday.length) });
  $('today-in').innerHTML = comingToday.length ? comingToday.slice(0, 60).map(g => guestItem(g)).join('') : emptyBox('e_in');
  $('sub-today-out').textContent = t('n_guests', { n: fmt(leavingToday.length) });
  $('today-out').innerHTML = leavingToday.length ? leavingToday.slice(0, 60).map(g => guestItem(g)).join('') : emptyBox('e_out');
  const q = $('g-q').value.trim().toLowerCase(), sf = $('g-st').value;
  const list = GUESTS.filter(g => (sf === '' || (sf === 'faol' ? g.holat !== 'ketgan' : g.holat === sf)) && (!q || g.ism.toLowerCase().includes(q) || (g.xona || '').toLowerCase().includes(q)))
    .sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  $('sub-guests').textContent = t('n_guests', { n: fmt(list.length) });
  $('guest-list').innerHTML = list.length ? list.slice(0, 100).map(g => guestItem(g)).join('') : emptyBox(GUESTS.length ? 'e_filter' : 'e_none');
  ['today-in', 'today-out', 'guest-list'].forEach(id => wireOps($(id)));
  dbState('db_ok', { n: GUESTS.length });
  if ($('a-xona').options.length !== freeRooms().length + ($('a-holat').value === 'bron' ? 1 : 0)) fillRooms($('a-xona').value);
  renderRooms(cnt); renderStaff();
}
$('g-q').addEventListener('input', renderOps); $('g-st').addEventListener('change', renderOps);
function dbState(key, v) { $('dbstate').textContent = key ? t(key, v) : ''; }

/* ---- Xonalar ---- */
function renderRooms(cnt) {
  cnt = cnt || (() => { const c = { toza: 0, iflos: 0, band: 0 }; ROOMS.forEach(r => c[roomState(r)]++); return c; })();
  $('i-xonalar').textContent = t(ROLE === 'tozalovchi' ? 'i_xonalar_t' : 'i_xonalar');
  if (VIEW === 'xonalar') $('pg-sub').textContent = $('i-xonalar').textContent;
  $('room-sum').innerHTML = [['toza', 'r_clean'], ['iflos', 'r_dirty'], ['band', 'r_busy']].map(([k, l]) => `<div class="rs rs-${k}"><b>${fmt(cnt[k])}</b><span>${t(l)}</span></div>`).join('');
  const kc = k => { const c = { iflos: 0, toza: 0, band: 0 }; ROOMS.filter(r => r[0] === k).forEach(r => c[roomState(r)]++); return c; };
  $('korpus-tabs').innerHTML = KORPUS.map(k => { const c = kc(k); return `<button class="tab" role="tab" type="button" aria-selected="${KSEL === k}" data-k="${k}">${t('korpus', { k })} ${c.iflos ? `<small class="dot-y">${c.iflos}</small>` : ''}</button>`; }).join('');
  $('korpus-tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => { KSEL = b.dataset.k; ROOMSEL = null; renderRooms(); });
  const only = $('only-dirty').checked;
  $('sub-rooms').textContent = only ? t('r_dirty_all', { n: fmt(cnt.iflos) }) : t('r_korpus_sub', { k: KSEL });
  $('korpus-tabs').hidden = only;
  const tile = r => `<button type="button" class="room r-${roomState(r)} ${ROOMSEL === r ? 'sel' : ''}" data-r="${r}" aria-label="${r}: ${esc(t('r_' + ({ toza: 'clean', iflos: 'dirty', band: 'busy' })[roomState(r)]))}">${only ? r : r.slice(1)}</button>`;
  if (only) {
    const dirty = ROOMS.filter(r => roomState(r) === 'iflos');
    $('room-grid').innerHTML = dirty.length ? `<div class="tiles">${dirty.map(tile).join('')}</div>` : emptyBox('e_dirty');
  } else {
    $('room-grid').innerHTML = [4, 3, 2, 1].map(f => `<div class="floor"><span class="fl">${t('qavat', { f })}</span><div class="tiles">${ROOMS.filter(r => r[0] === KSEL && r[1] === String(f)).map(tile).join('')}</div></div>`).join('');
  }
  $('room-grid').querySelectorAll('.room').forEach(b => b.onclick = () => { ROOMSEL = b.dataset.r; ROOMCONFIRM = false; renderRooms(); });
  /* tozalash vazifalari ro'yxati */
  const dirtyAll = ROOMS.filter(r => roomState(r) === 'iflos').sort((x, y) => String((ROOMS_DB[x] || {}).at).localeCompare(String((ROOMS_DB[y] || {}).at)));
  $('sub-tasks').textContent = t('sub_tasks', { n: fmt(dirtyAll.length) });
  $('hk-card').hidden = ROLE !== 'tozalovchi' && !dirtyAll.length;
  $('hk-tasks').innerHTML = dirtyAll.length ? dirtyAll.slice(0, 60).map(r => `<div class="op hk"><div class="op-main"><b>${r}</b><span>${t('korpus', { k: r[0] })} · ${t('qavat', { f: r[1] })}${ROOMS_DB[r] && ROOMS_DB[r].at ? ' · ' + String(ROOMS_DB[r].at).slice(11, 16) : ''}</span></div><div class="op-act">${
    HKASK === r ? `<button type="button" class="btn sm ok" data-hk-yes="${r}">${t('r_yes_clean')}</button><button type="button" class="btn sm" data-hk-no="1">${t('del_no')}</button>` : `<button type="button" class="btn ok" data-hk="${r}">${t('r_mark_clean')}</button>`}</div></div>`).join('') : emptyBox('e_dirty');
  $('hk-tasks').querySelectorAll('[data-hk]').forEach(b => b.onclick = () => { HKASK = b.dataset.hk; renderRooms(); });
  $('hk-tasks').querySelectorAll('[data-hk-no]').forEach(b => b.onclick = () => { HKASK = null; renderRooms(); });
  $('hk-tasks').querySelectorAll('[data-hk-yes]').forEach(b => b.onclick = () => { const r = b.dataset.hkYes; HKASK = null; setRoom(r, true); });
  renderRoomInfo();
}
$('only-dirty').addEventListener('change', () => { ROOMSEL = null; renderRooms(); });
function renderRoomInfo() {
  const el = $('room-info'); if (!ROOMSEL) { el.innerHTML = `<span class="hint">${t('r_pick')}</span>`; return; }
  const r = ROOMSEL, s = roomState(r), occ = occupant(r), info = ROOMS_DB[r];
  let h = `<b class="rn r-${s}">${r}</b> <span>${t('r_' + ({ toza: 'clean', iflos: 'dirty', band: 'busy' })[s])}</span>`;
  if (s === 'band' && occ && ROLE !== 'tozalovchi') h += ` · <span>${esc(occ.ism)} · ${t('g_until', { d: occ.ketish || '—' })}</span>`;
  if (s === 'band' && ROLE === 'tozalovchi') h += ` · <span>${t('r_busy_t')}</span>`;
  if (info && info.at) h += ` <small class="hint">· ${t('r_changed', { d: String(info.at).slice(0, 16).replace('T', ' ') })}</small>`;
  if (s === 'iflos') h += ROOMCONFIRM ? ` <span>${t('r_q_clean', { x: r })}</span> <button type="button" class="btn sm ok" id="r-yes">${t('r_yes_clean')}</button><button type="button" class="btn sm" id="r-no">${t('del_no')}</button>`
    : ` <button type="button" class="btn sm ok big-btn" id="r-clean">${t('r_mark_clean')}</button>`;

function memDB(seed) {

    doc: p => { const [c, id] = sp(p); return {

      if (!loginOk(login)) return ggmsg('gt_login_bad'); if (!passOk(p1)) return ggmsg('gt_pass_bad'); if (p1 !== p2) return ggmsg('gt_pass_diff');
      const btn = $('gg-form').querySelector('button[type=submit]'); btn.disabled = true;
      try {
        const salt = hex(crypto.getRandomValues(new Uint8Array(16))), iter = 150000, hash = await passHash(p1, salt, iter);
        const cred = { login, salt, iter, hash, at: nowIso() };
        await DB.doc(`data/users/${UID}/mehmon`).set(cred); GCRED = cred;
        const prev = GPROF || {};
        await DB.doc('mijozlar/' + UID).set({ ism, tel, login, createdAt: prev.createdAt || nowIso(), sorov: prev.sorov || null, sorovHal: prev.sorovHal || null });
        try { sessionStorage.setItem('kt_g', UID); } catch (x) {}
        GSTAGE = 'in'; renderG(); window.scrollTo(0, 0);
      } catch (err) { btn.disabled = false; ggmsg(err && err.code === 'invalid_argument' ? 'g_no_write' : 'a_fail'); }
    });
    return;
  }
  if (GSTAGE === 'login') {
    M.innerHTML = gAuthCard(`<h2>${t('g_login_h')}</h2><p class="g-sub">${t('g_login_p')}</p>
      ${GCRED ? '' : `<p class="notice-s">${t('g_no_acc')}</p>`}
      <form id="gg-form" class="gform one" novalidate>
        ${gin('gg-login', 'gt_login', 'text', 'username', 'maxlength="20" autocapitalize="none" spellcheck="false"')}${gin('gg-pass', 'gt_pass', 'password', 'current-password')}
        <button class="btn primary big-btn" type="submit">${t('gt_enter')}</button><span class="formmsg" id="gg-msg" role="status"></span>
      </form>
      <p class="g-switch">${t('g_no_have')} <button type="button" class="linkbtn" id="gg-toreg">${t('g_no_have_btn')}</button>${GCRED ? ` · <button type="button" class="linkbtn" id="gg-forgot">${t('gt_forgot')}</button>` : ''}</p>`);
    wireGPw();
    $('gg-toreg').onclick = () => { GSTAGE = GCRED ? 'reset' : 'register'; renderG(); };
    if ($('gg-forgot')) $('gg-forgot').onclick = () => { GSTAGE = 'reset'; renderG(); };
    $('gg-form').addEventListener('submit', async e => {
      e.preventDefault(); const now = Date.now();
      if (now < GWAIT) return ggmsg('gt_wait', { s: Math.ceil((GWAIT - now) / 1000) });
      const login = normLogin($('gg-login').value), pass = $('gg-pass').value;
      if (!login || !pass) return ggmsg('gt_fill');
      if (!GCRED) return ggmsg('g_no_acc');
      const h = await passHash(pass, GCRED.salt, GCRED.iter || 150000);
      if (login === GCRED.login && h === GCRED.hash) { GFAILS = 0; try { sessionStorage.setItem('kt_g', UID); } catch (x) {} GSTAGE = 'in'; renderG(); window.scrollTo(0, 0); }
      else { GFAILS++; $('gg-pass').value = ''; if (GFAILS >= 5) { GWAIT = Date.now() + 30000; GFAILS = 0; ggmsg('gt_wait', { s: 30 }); } else ggmsg('gt_wrong', { n: 5 - GFAILS }); }
    });
    return;
  }
  renderPortal();
}

/* ---- bildirishnomalar (ma'lumotdan hisoblanadi) ---- */
function gNotices(w) {
  const p = GPROF || {}, td = today(), out = [], recent = at => at && daysBetween(String(at).slice(0, 10), td) <= 5;
  if (p.sorov && +p.sorov.summa > 0) out.push(['wait', t('n_topup_wait', { s: som(p.sorov.summa) }), 'hamyon']);
  else if (p.sorovHal && recent(p.sorovHal.at)) out.push([p.sorovHal.holat === 'qabul' ? 'ok' : 'bad', t(p.sorovHal.holat === 'qabul' ? 'w_hal_ok' : 'w_hal_no', { s: som(p.sorovHal.summa) }), 'hamyon']);
  arr(p.bronlar).forEach(b => { if (b.holat === 'kutilmoqda') out.push(['wait', t('n_bron_wait', { d: b.kel }), 'bron']); else if (recent(b.hal)) out.push([b.holat === 'qabul' ? 'ok' : 'bad', t(b.holat === 'qabul' ? 'n_bron_ok' : 'n_bron_no', { d: b.kel }), 'bron']); });
  arr(p.buyurtmalar).forEach(o => { if (o.holat === 'kutilmoqda') out.push(['wait', t('n_ord_wait', { s: som(o.jami) }), 'taomnoma']); else if (recent(o.hal)) out.push([o.holat === 'rad' ? 'bad' : 'ok', t(o.holat === 'rad' ? 'n_ord_no' : 'n_ord_ok', { s: som(o.jami) }), 'taomnoma']); });
  arr(p.xabarlar).forEach(m => { if (m.javob && recent(m.javobAt)) out.push(['ok', t('n_msg_reply'), 'yordam']); });
  if (w.expired) out.push(['bad', t('w_expired', { d: w.muddat }), 'hamyon']); else if (w.soon) out.push(['wait', t('n_soon', { n: w.left }), 'hamyon']);
  if (w.balans > 0 && w.kunlar < 1 && !w.expired) out.push(['wait', t('n_low'), 'hamyon']);
  const promos = (KAT.aksiyalar || []).filter(a => !a.gacha || a.gacha >= td).length; if (promos) out.push(['info', t('n_promos', { n: promos }), 'aksiyalar']);
  return out;
}

/* ---- qidiruv ---- */
function gSearch(q) {
  q = q.trim().toLowerCase(); if (q.length < 2) return [];
  const has = (...xs) => xs.some(x => String(x || '').toLowerCase().includes(q)), r = [];
  ['bosh', ...GSECS].forEach(k => { if (k !== 'bosh' && has(t('gt_' + k), t('gd_' + k))) r.push([t('gt_' + k), t('gd_' + k), k]); });
  (KAT.menyu || []).forEach(i => { if (has(i.nom, i.tavsif)) r.push([i.nom, `${t('gt_taomnoma')} · ${som(i.narx)}`, 'taomnoma']); });
  (KAT.aksiyalar || []).forEach(a => { if (has(a.nom, a.matn)) r.push([a.nom, t('gt_aksiyalar'), 'aksiyalar']); });
  (KAT.qulayliklar || []).forEach(a => { if (has(a.nom, a.matn)) r.push([a.nom, t('gt_qulayliklar') + (a.vaqt ? ' · ' + a.vaqt : ''), 'qulayliklar']); });
  for (let i = 1; i <= 8; i++) if (has(t('faq_q' + i), t('faq_a' + i))) r.push([t('faq_q' + i), t('gt_yordam'), 'yordam']);
  return r.slice(0, 12);
}

      <span class="hint cart-w">${jami > w.balans ? t('cart_low', { s: som(w.balans) }) : t('cart_ok', { s: som(w.balans - jami) })}</span>
      <button type="submit" class="btn primary big-btn" ${jami > w.balans ? 'disabled' : ''}>${t('cart_send')}</button><button type="button" class="btn" id="cart-clear">${t('cart_clear')}</button><span class="formmsg" id="ord-msg" role="status"></span></form></section>` : '';
    const cbar = lines.length ? `<a class="cart-bar" href="#cart" id="cart-jump"><span>${t('cart_bar', { n: cartCount() })}</span><b>${som(jami)}</b></a>` : '';
    return `<section class="g-body">${menu}</section>${cart}${cbar}
      <section class="g-body"><h2>${t('ord_mine')}</h2>${orders.length ? `<div class="g-list">${orders.map(o => `<div class="g-row"><span>${esc(String(o.at || '').slice(0, 16).replace('T', ' '))} ${stPill(o.holat)}<br><small>${esc(o.items.map(i => `${i.nom} × ${i.soni}`).join(', '))}${o.joy ? ' · ' + esc(o.joy) : ''}</small></span><b>${som(o.jami)}</b></div>`).join('')}</div>` : `<p class="empty">${t('e_ord')}</p>`}</section>`;
  }
  if (GTAB === 'aksiyalar') {
    const act = (KAT.aksiyalar || []).filter(a => !a.gacha || a.gacha >= td);
    return act.length ? `<div class="g-cards">${act.map(a => `<article class="g-card promo">${+a.chegirma ? `<span class="promo-b">−${+a.chegirma}%</span>` : ''}<h3>${esc(a.nom)}</h3><p>${esc(a.matn || '')}</p>${a.gacha ? `<small>${t('promo_until', { d: a.gacha })}</small>` : ''}<button type="button" class="btn sm" data-go-g="bron">${t('promo_book')}</button></article>`).join('')}</div><p class="hint">${t('promo_how')}</p>` : `<p class="empty">${t('e_promo')}</p>`;
  }
  if (GTAB === 'chegirmalar') {
    const v = +((GWAL || {}).tashriflar) || 0, nx = w.tier.next;
    const pctv = nx ? Math.min(100, Math.round(100 * (v - w.tier.min) / Math.max(1, nx.min - w.tier.min))) : 100;
    return `<div class="loy"><p>${t('loy_now', { t: esc(w.tier.nom), c: w.tier.ch, v })}</p>
      <div class="bar" role="progressbar" aria-valuenow="${pctv}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pctv}%"></i></div>
      <p class="hint">${nx ? t('loy_next', { n: nx.min - v, t: esc(nx.nom), c: nx.ch }) : t('loy_top')}</p></div>
      <div class="tiers">${w.tier.all.map((d, i) => `<div class="tier-c t${i} ${i === w.tier.idx ? 'cur' : ''}"><b>${esc(d.nom)}</b><span class="big">${d.ch}%</span><small>${t('loy_from', { n: d.min })}</small></div>`).join('')}</div>
      <p class="hint">${t('loy_how')}</p>`;
  }
  if (GTAB === 'qulayliklar') {
    const q = KAT.qulayliklar || [];
    return q.length ? `<div class="g-cards">${q.map(a => `<article class="g-card"><h3>${esc(a.nom)}</h3><p>${esc(a.matn || '')}</p><small>${a.vaqt ? esc(a.vaqt) + ' · ' : ''}<span class="pill ${a.pullik ? 'st-bron' : 'st-oromgohda'}">${t(a.pullik ? 'q_paid' : 'q_free')}</span></small>${a.pullik ? `<button type="button" class="btn sm" data-ask="${esc(a.nom)}">${t('q_ask')}</button>` : ''}</article>`).join('')}</div>` : `<p class="empty">${t('e_amen')}</p>`;
  }
  if (GTAB === 'haqida') {
    const U = MAPS.uz;
    return `<div class="about-g"><section class="g-card-l"><p>${t('ab_text')}</p>
        <dl class="facts"><div><dt>${t('ab_addr_l')}</dt><dd>${t('ab_addr')}</dd></div><div><dt>${t('ab_in_l')}</dt><dd>14:00</dd></div><div><dt>${t('ab_out_l')}</dt><dd>12:00</dd></div><div><dt>${t('ab_rooms_l')}</dt><dd>${t('ab_rooms')}</dd></div><div><dt>${t('ab_rec_l')}</dt><dd>${t('ab_rec')}</dd></div></dl></section>
      <section class="g-card-l"><svg class="map gmap" viewBox="0 0 ${U.w} ${U.h}" role="img" aria-label="${esc(t('ab_map'))}">${U.nb.map(d => `<path class="nb" d="${d}"></path>`).join('')}${U.r.map(r => `<path class="c" d="${r.p}"></path>`).join('')}<g class="resort"><circle r="8" cx="${U.resort.x}" cy="${U.resort.y}"></circle><text x="${U.resort.x + 11}" y="${U.resort.y - 11}">Oromgoh.uz</text></g></svg><p class="hint">${t('ab_map')}</p></section></div>
      <section class="g-body"><h2>${t('ab_rules_h')}</h2><ul class="rules">${[1, 2, 3, 4, 5].map(i => `<li>${t('ab_rule' + i)}</li>`).join('')}</ul></section>`;
  }
  if (GTAB === 'yordam') {
    const msgs = arr(p.xabarlar).slice().reverse();
    return `<section class="g-body"><h2>${t('faq_h')}</h2><div class="faq">${[1, 2, 3, 4, 5, 6, 7, 8].map(i => `<details><summary>${t('faq_q' + i)}</summary><p>${t('faq_a' + i)}</p></details>`).join('')}</div></section>
      <section class="g-card-l"><h2>${t('msg_h')}</h2><form id="msg-form" class="gform one" novalidate><label for="msg-txt">${t('msg_l')}<textarea id="msg-txt" rows="3" maxlength="500" placeholder="${esc(t('msg_ph'))}">${esc(GMSG)}</textarea></label>
        <button type="submit" class="btn primary">${t('msg_send')}</button><span class="formmsg" id="msg-msg" role="status"></span></form><p class="hint">${t('ab_rec_l')}: ${t('ab_rec')}</p></section>
      <section class="g-body"><h2>${t('msg_mine')}</h2>${msgs.length ? `<div class="g-list">${msgs.map(m => `<div class="g-row col"><span><small>${esc(String(m.at || '').slice(0, 16).replace('T', ' '))}</small><br>${esc(m.matn)}</span>${m.javob ? `<span class="reply"><b>${t('msg_reply')}</b> ${esc(m.javob)}</span>` : `<small class="hint">${t('msg_wait')}</small>`}</div>`).join('')}</div>` : `<p class="empty">${t('e_msg')}</p>`}</section>`;
  }
  return `<form id="pf-form" class="gform" novalidate>
      ${gin('pf-ism', 'g_ism', 'text', 'name', `maxlength="60" value="${esc(p.ism || '')}"`)}${gin('pf-tel', 'g_tel', 'tel', 'tel', `maxlength="20" value="${esc(p.tel || '')}"`)}
      <button type="submit" class="btn primary">${t('k_save')}</button><span class="formmsg" id="pf-msg" role="status"></span></form>
    <dl class="facts"><div><dt>${t('gt_login')}</dt><dd>${esc((GCRED && GCRED.login) || '')}</dd></div><div><dt>${t('pf_tier')}</dt><dd>${esc(w.tier.nom)} · ${w.tier.ch}%</dd></div><div><dt>${t('pf_visits')}</dt><dd>${+((GWAL || {}).tashriflar) || 0}</dd></div><div><dt>${t('pf_since')}</dt><dd>${esc(String(p.createdAt || '').slice(0, 10))}</dd></div></dl>
    <div class="pf-acts"><button type="button" class="btn" id="pf-pass">${t('pf_pass')}</button><button type="button" class="btn danger" id="pf-out">${t('lock')}</button></div>`;
}
let GBR = {}, GMSG = '';
function brEstimate(w) {
  const r = roomTypes()[GBR.tur || 0] || roomTypes()[0], kel = GBR.kel, ket = GBR.ket, a = Math.max(1, +GBR.katta || 1), c = Math.max(0, +GBR.bola || 0);
  const n = kel && ket ? daysBetween(kel, ket) : 0;
  const sum = n > 0 ? Math.round(soz().narx * r.k * (a + c * 0.5) * n * (100 - w.tier.ch) / 100) : 0;
  return { r, n, a, c, sum };
}
function wireSection(w) {
  const M = $('g-main'), say = (id, cls, key, v) => { const m = $(id); if (m) { m.className = 'formmsg ' + cls; m.textContent = t(key, v); } };
  const wrErr = e => e && e.code === 'invalid_argument' ? 'g_no_write' : 'a_fail';
  M.querySelectorAll('[data-topup-go]').forEach(b => b.onclick = () => { goTab('hamyon'); GTOPUP = true; });
  if ($('tu-open')) $('tu-open').onclick = () => { GTOPUP = !GTOPUP; renderG(); };
  if ($('tu-cancel')) $('tu-cancel').onclick = async () => { try { await profPatch({ sorov: null }); } catch (e) {} };
  M.querySelectorAll('[data-sum]').forEach(b => b.onclick = () => { GSUM = +b.dataset.sum; renderG(); });
  if ($('tu-sum')) $('tu-sum').oninput = () => { GSUM = Math.round(+$('tu-sum').value || 0); };
  if ($('tu-form')) $('tu-form').addEventListener('submit', async e => {
    e.preventDefault(); const s = Math.round(+$('tu-sum').value || 0);
    if (!(s >= 50000) || s > 100000000) return say('tu-msg', 'err', 'w_sum_bad');
    try { await profPatch({ sorov: { summa: s, usul: $('tu-usul').value, at: nowIso() } }); GTOPUP = false; renderG(); } catch (err) { say('tu-msg', 'err', wrErr(err)); }
  });
  /* qidiruv */
  if ($('g-sq')) $('g-sq').addEventListener('input', () => {
    const r = gSearch($('g-sq').value), box = $('g-sres');
    box.innerHTML = $('g-sq').value.trim().length < 2 ? '' : r.length ? r.map(([a, b, k]) => `<button type="button" data-go-g="${k}"><b>${esc(a)}</b><small>${esc(b)}</small></button>`).join('') : `<p class="empty">${t('g_search_none')}</p>`;
    box.querySelectorAll('[data-go-g]').forEach(b => b.onclick = () => goTab(b.dataset.goG));
  });
  /* bron */
  if ($('br-form')) {
    const read = () => { GBR = { kel: $('br-kel').value, ket: $('br-ket').value, katta: +$('br-katta').value, bola: +$('br-bola').value, tur: +((M.querySelector('[name=br-tur]:checked') || {}).value || 0), izoh: $('br-izoh').value }; };
    const est = () => { read(); const e = brEstimate(w); $('br-est').innerHTML = e.n > 0 ? `<span>${t('bron_est', { n: e.n, t: esc(e.r.nom), a: e.a, c: e.c })}${w.tier.ch ? ' · ' + t('w_rate_d', { c: w.tier.ch }) : ''}</span><b>≈ ${som(e.sum)}</b><small>${e.sum <= w.balans ? t('bron_cov') : t('bron_nocov', { s: som(e.sum - w.balans) })}</small>` : `<span>${t('bron_dates')}</span>`; };
    $('br-form').addEventListener('input', est); est();
    $('br-form').addEventListener('submit', async e => {
      e.preventDefault(); read(); const x = brEstimate(w), td = today();
      if (!GBR.kel || GBR.kel < td) return say('br-msg', 'err', 'bron_bad_kel');
      if (!(x.n > 0) || x.n > 60) return say('br-msg', 'err', 'bron_bad_ket');
      if (!(x.a >= 1 && x.a <= 10) || x.c > 10) return say('br-msg', 'err', 'bron_bad_ppl');
      const b = { id: uidN(), kel: GBR.kel, ket: GBR.ket, katta: x.a, bola: x.c, tur: x.r.nom, izoh: String(GBR.izoh || '').slice(0, 140), taxmin: x.sum, holat: 'kutilmoqda', at: nowIso() };
      try { await profPatch({ bronlar: arr((GPROF || {}).bronlar).concat([b]).slice(-20) }); GBR = {}; say('br-msg', 'ok', 'bron_sent'); renderG(); } catch (err) { say('br-msg', 'err', wrErr(err)); }
    });
  }
  M.querySelectorAll('[data-br-cancel]').forEach(b => b.onclick = async () => { try { await profPatch({ bronlar: arr(GPROF.bronlar).filter(x => x.id !== b.dataset.brCancel) }); } catch (e) {} });
  /* taomnoma */
  M.querySelectorAll('[data-inc]').forEach(b => b.onclick = () => { const k = +b.dataset.inc; GCART[k] = Math.min(20, (GCART[k] || 0) + 1); renderG(); });
  M.querySelectorAll('[data-dec]').forEach(b => b.onclick = () => { const k = +b.dataset.dec; GCART[k] = Math.max(0, (GCART[k] || 0) - 1); if (!GCART[k]) delete GCART[k]; renderG(); });
  if ($('cart-clear')) $('cart-clear').onclick = () => { GCART = {}; renderG(); };
  if ($('cart-jump')) $('cart-jump').onclick = e => { e.preventDefault(); $('cart').scrollIntoView({ behavior: 'smooth' }); };
  if ($('ord-joy')) $('ord-joy').oninput = () => { GPLACE = $('ord-joy').value; };
  if ($('ord-form')) $('ord-form').addEventListener('submit', async e => {
    e.preventDefault(); const ch = w.tier.ch, lines = cartLines(); if (!lines.length) return;
    const items = lines.map(i => ({ nom: i.nom, soni: i.soni, narx: Math.round((+i.narx || 0) * (100 - ch) / 100) })), jami = items.reduce((a, i) => a + i.narx * i.soni, 0);
    if (jami > w.balans) return say('ord-msg', 'err', 'cart_low', { s: som(w.balans) });
    const joy = String(GPLACE || '').trim().slice(0, 40); if (!joy) return say('ord-msg', 'err', 'cart_need_place');
    try { await profPatch({ buyurtmalar: arr((GPROF || {}).buyurtmalar).concat([{ id: uidN(), items, jami, joy, holat: 'kutilmoqda', at: nowIso() }]).slice(-20) }); GCART = {}; renderG(); say('ord-msg', 'ok', 'cart_sent'); }
    catch (err) { say('ord-msg', 'err', wrErr(err)); }
  });
  /* qulayliklar -> yordamga savol */
  M.querySelectorAll('[data-ask]').forEach(b => b.onclick = () => { GMSG = t('q_ask_txt', { x: b.dataset.ask }); goTab('yordam'); });
  /* yordam */
  if ($('msg-txt')) $('msg-txt').oninput = () => { GMSG = $('msg-txt').value; };
  if ($('msg-form')) $('msg-form').addEventListener('submit', async e => {
    e.preventDefault(); const m = $('msg-txt').value.trim().slice(0, 500); if (m.length < 3) return say('msg-msg', 'err', 'msg_short');
    try { await profPatch({ xabarlar: arr((GPROF || {}).xabarlar).concat([{ id: uidN(), matn: m, at: nowIso() }]).slice(-20) }); GMSG = ''; renderG(); say('msg-msg', 'ok', 'msg_sent'); }
    catch (err) { say('msg-msg', 'err', wrErr(err)); }
  });
  /* profil */
  if ($('pf-form')) $('pf-form').addEventListener('submit', async e => {
    e.preventDefault(); const ism = $('pf-ism').value.trim().slice(0, 60), tel = $('pf-tel').value.trim().slice(0, 20);
    if (!ism) return say('pf-msg', 'err', 'a_err_name'); if (!/^\+?[\d\s()-]{7,20}$/.test(tel)) return say('pf-msg', 'err', 'g_tel_bad');
    try { await profPatch({ ism, tel }); say('pf-msg', 'ok', 'k_saved'); } catch (err) { say('pf-msg', 'err', 'a_fail'); }
  });
  if ($('pf-pass')) $('pf-pass').onclick = () => { GSTAGE = 'reset'; renderG(); window.scrollTo(0, 0); };
  if ($('pf-out')) $('pf-out').onclick = () => $('g-out').click();
}

    const muddat = i === 7 ? addDays(td, 12) : i === 3 ? addDays(td, -20) : addMonths(addDays(td, -Math.floor(rnd() * 200)), 12);
