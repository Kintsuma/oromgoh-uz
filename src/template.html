<meta name="claude:viewport-fit-sides" content="cover">

<style>
__CSS__
/* ---- 3-versiya qo'shimchalari ---- */
.sections{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
@media (max-width:640px){.sections{display:flex;overflow-x:auto;padding-bottom:4px}}
.sections button{min-width:96px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.langs{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.langs button{border:0;background:none;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--lapis);color:var(--on-accent)}
.map{width:100%;height:auto;display:block}
.map path.c{stroke:var(--panel);stroke-width:.6;cursor:pointer;transition:opacity .15s}
.map path.c.none{fill:var(--line);cursor:default}
.map path.c:hover{opacity:.8}
.map path.c[data-sel="1"]{stroke:var(--ink);stroke-width:1.6}
.map path.nb{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:3 3}
.map circle.dot{stroke:var(--panel);stroke-width:1;cursor:pointer}
.map text.lb{font-family:var(--mono);font-size:11px;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:3px;pointer-events:none;text-anchor:middle}
.maplegend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.maplegend .ramp{display:flex;height:10px;width:200px;border-radius:5px;overflow:hidden}
.maplegend .ramp i{flex:1}
.mapinfo{font-size:14px;min-height:22px}
.mapinfo b{font-family:var(--mono)}
.cmp-pick{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:end}
@media (max-width:620px){.cmp-pick{grid-template-columns:minmax(0,1fr)}}
.cmp-pick label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;min-width:0}
table.vs{min-width:560px}
table.vs td.metric{color:var(--muted)}
table.vs td.va,table.vs td.vb{font-family:var(--mono);font-variant-numeric:tabular-nums}
table.vs .mini{display:block;height:5px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden}
table.vs .mini i{display:block;height:100%}
table.vs th.ha{color:var(--lapis)} table.vs th.hb{color:var(--zar)}
.win{font-weight:700}
.seasons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:620px){.seasons{grid-template-columns:repeat(2,minmax(0,1fr))}}
.season{background:var(--bg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;border-top:4px solid var(--c)}
.season .nm{font-size:13px;color:var(--muted);font-weight:600}
.season b{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.season small{color:var(--muted);font-family:var(--mono);font-size:12px}
.season.top{outline:2px solid var(--c)}
.fc-nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:620px){.fc-nums{grid-template-columns:minmax(0,1fr)}}
.clusters{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.cl{border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;border-top:4px solid var(--c)}
.cl h3{font-size:16px;font-weight:700}
.cl .cnt{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cl .cnt b{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.cl .cnt span{font-family:var(--mono);font-size:13px;color:var(--muted)}
.cl dl{margin:0;display:grid;grid-template-columns:auto auto;gap:4px 12px;font-size:13px}
.cl dt{color:var(--muted)} .cl dd{margin:0;text-align:right;font-family:var(--mono)}
.parts.four{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:900px){.parts.four{grid-template-columns:minmax(0,1fr)}}
.tag.tree{background:var(--zar-soft);color:var(--zar)}
.tag.dest{background:var(--line);color:var(--ink)}
.big.tree{color:var(--zar)}
.treebox{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.treebox svg{display:block;min-width:720px;width:100%;height:auto}
.treebox rect.nd{fill:var(--panel);stroke:var(--line);stroke-width:1}
.treebox rect.nd.on{stroke:var(--zar);stroke-width:2.5}
.treebox line.ed{stroke:var(--line);stroke-width:1.5}
.treebox line.ed.on{stroke:var(--zar);stroke-width:3}
.treebox text{font-family:var(--body);font-size:12px;fill:var(--ink)}
.treebox text.sm{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.treebox text.el{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.dest-list{display:flex;flex-direction:column;gap:4px;max-width:720px}
.part.wide{grid-column:1/-1}
#d-val{font-size:clamp(30px,4.5vw,46px)}
.part.wide .pred-out{max-width:720px}
.addbox{border:1px dashed var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.addform{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:900px){.addform{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.addform{grid-template-columns:minmax(0,1fr)}}
.addform label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;min-width:0}
.addform input,.addform select{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;text-transform:none;letter-spacing:0;font-weight:400}
.addform .full{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.formmsg{font-size:14px}
.formmsg.ok{color:var(--firuza)} .formmsg.err{color:var(--qizil)}
.pill.new{background:var(--zar-soft);color:var(--zar)}
.rowdel{font-size:12px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.rowdel.danger{border-color:var(--qizil);color:var(--qizil)}
.dbstate{font-size:13px;color:var(--muted)}
/* ---- Kirish, qabulxona, xonalar ---- */
.who{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.who .pill{background:var(--lapis-soft);color:var(--lapis)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ok{background:var(--r-toza);border-color:var(--r-toza);color:var(--r-ink)}
.btn.warn{background:var(--r-iflos);border-color:var(--r-iflos);color:var(--r-ink-y)}
.btn.danger{border-color:var(--qizil);color:var(--qizil)}
.big-btn{padding:10px 18px;font-size:15px}
select.sm{font:inherit;font-size:13px;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:auto}
.gate{display:flex;justify-content:center;padding-block:24px}
.gate-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:14px}
.gate-card h2{font-size:24px}
.gate-card p{margin:0;color:var(--muted)}
.gform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:end}
.gform.one{grid-template-columns:minmax(0,1fr)}

/* ===== Mehmonlar sayti ===== */
/* ===== mehmonlar sayti: navigatsiya ===== */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.g-nav{display:flex;gap:4px;justify-content:space-around;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px;order:-1}
.g-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--muted);font-size:12px;font-weight:600;padding:6px 4px;border-radius:10px;cursor:pointer;min-width:0}
.g-nav button svg,.g-tile svg,.g-sech svg,.g-search svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.g-nav button[aria-current="page"]{color:var(--firuza);background:var(--firuza-soft)}
.g-nav span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
@media (max-width:760px){
  .g-nav{order:0;position:fixed;left:0;right:0;bottom:0;z-index:20;border-radius:0;border-width:1px 0 0;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
  .gsite{padding-bottom:84px}
}
.g-crumb{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.g-back{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 14px;font-weight:700;cursor:pointer}

.g-path{color:var(--muted);font-size:14px}
.g-sech{display:flex;gap:14px;align-items:center}.g-sech svg{width:40px;height:40px;padding:8px;border-radius:12px;background:var(--firuza-soft);color:var(--firuza);box-sizing:content-box}
.g-sech h1{font-size:clamp(24px,4vw,30px)}.g-sech p{margin:2px 0 0;color:var(--muted)}
.g-search{position:relative}

.g-search input:focus{border-color:var(--firuza);outline:none;box-shadow:0 0 0 3px var(--firuza-soft)}
.g-sres{display:flex;flex-direction:column;margin-top:6px;background:var(--panel);border-radius:12px;overflow:hidden}

.g-sres button{display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:10px 14px;cursor:pointer}
.g-sres button:first-child{border-top:0}.g-sres button:hover{background:var(--firuza-soft)}.g-sres small{color:var(--muted)}.g-sres .empty{padding:10px 14px}
.g-notes{display:flex;flex-direction:column;gap:6px}.g-notes h2,.g-group h2{font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-family:var(--body)}
.g-note{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);border-left:4px solid var(--lapis);background:var(--panel);border-radius:10px;padding:10px 14px;cursor:pointer}
.g-note.n-ok{border-left-color:var(--r-toza)}.g-note.n-bad{border-left-color:var(--qizil)}.g-note.n-wait{border-left-color:var(--r-iflos)}
.g-group{display:flex;flex-direction:column;gap:8px}
.g-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.g-tile{position:relative;display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px;cursor:pointer;min-width:0}
.g-tile:hover{border-color:var(--firuza);box-shadow:0 2px 0 var(--firuza-soft)}
.g-tile svg{width:26px;height:26px;padding:9px;border-radius:12px;background:var(--firuza-soft);color:var(--firuza);box-sizing:content-box}
.g-tt{display:flex;flex-direction:column;min-width:0}.g-tt small{color:var(--muted);font-size:13px;line-height:1.35}
.g-tile .badge{position:absolute;top:10px;right:10px}.badge.soft{background:var(--lapis-soft);color:var(--lapis)}
.wallet.compact{padding:20px}.wallet.compact .w-bal{font-size:clamp(30px,6vw,42px)}
.w-acts{display:flex;gap:8px;flex-wrap:wrap}.w-btn.ghost{background:transparent;color:var(--on-accent);border:1px solid currentColor}
.g-card-l{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}.g-card-l h2{font-size:19px}
.g-card-l .gform .full{grid-column:1/-1}
textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;resize:vertical}
.br-types{grid-column:1/-1;border:0;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.br-types legend{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.br-type{display:flex!important;flex-direction:row!important;gap:10px!important;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-transform:none!important;letter-spacing:0!important;font-weight:400!important;color:var(--ink)!important;font-size:14px!important}
.br-type:has(input:checked){border-color:var(--firuza);box-shadow:0 0 0 3px var(--firuza-soft)}
.br-type input{width:auto!important;margin-top:3px}.br-type span{display:flex;flex-direction:column}.br-type small{color:var(--muted)}
.br-est{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;background:var(--firuza-soft);border-radius:12px;padding:12px 14px}.br-est b{font-size:22px}.br-est small{color:var(--muted);flex-basis:100%}
.pill.gst-kutilmoqda{background:var(--zar-soft);color:var(--zar)}.pill.gst-qabul,.pill.gst-tayyor{background:var(--firuza-soft);color:var(--firuza)}.pill.gst-rad{background:var(--line);color:var(--muted)}
.qty{display:flex;align-items:center;gap:6px;flex:none}.qty b{min-width:18px;text-align:center}
.g-row.tot{background:var(--bg)}.g-row.col{flex-direction:column;align-items:flex-start;gap:6px}
.reply{background:var(--firuza-soft);border-radius:10px;padding:8px 10px;font-size:14px}
.cart{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:2px solid var(--firuza);border-radius:16px;padding:16px;scroll-margin-top:16px}.cart h2{font-size:19px}
.cart-w{grid-column:1/-1}
.cart-bar{position:sticky;bottom:12px;z-index:5;display:flex;justify-content:space-between;gap:10px;background:var(--firuza);color:var(--on-accent);border-radius:14px;padding:12px 16px;text-decoration:none;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.18)}
@media (max-width:760px){.cart-bar{bottom:84px}}
.about-g{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px}@media (max-width:820px){.about-g{grid-template-columns:minmax(0,1fr)}}

.facts dt{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}.facts dd{margin:2px 0 0;font-weight:700}
.gmap{width:100%;height:auto}.gmap .c{fill:var(--firuza-soft);stroke:var(--panel);stroke-width:1}.gmap .nb{fill:var(--bg);stroke:var(--line)}
.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.faq{display:flex;flex-direction:column;gap:6px}.faq details{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px 14px}
.faq summary{cursor:pointer;font-weight:700}.faq p{margin:8px 0 0;color:var(--muted)}
.pf-acts{display:flex;gap:8px;flex-wrap:wrap}
.gate-back{margin:8px 0 0;text-align:center;border-top:1px solid var(--line);padding-top:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}@media (max-width:1200px){.g3{grid-template-columns:minmax(0,1fr)}}
.msgtxt{color:var(--ink)!important;font-size:14px!important;flex-basis:100%}

.gsite{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px;padding-block:14px 0}
.g-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.g-brand .tb-brand{user-select:none;-webkit-user-select:none;cursor:default}
.g-brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.g-brand .tb-brand{font-size:24px}
.g-tag{color:var(--muted);font-size:14px}

.g-who .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--firuza);color:var(--on-accent);font-weight:700;font-size:13px}

@media (max-width:820px){.g-auth{grid-template-columns:minmax(0,1fr)}}

.g-auth-hero .tb-brand{border:0;padding:0;margin:0}
.w-btn{align-self:flex-start;background:var(--panel);color:var(--ink);border-color:transparent;font-weight:700;padding:10px 18px}
